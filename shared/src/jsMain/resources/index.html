<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>GymCopilot - Sistema de Gestión de Gimnasios</title>
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="GymCopilot">
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #00151C;
            overflow: hidden;
        }
        #ComposeTarget {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <input type="file" id="gym_copilot_image_input" accept="image/*" style="display:none">
    <canvas id="ComposeTarget"></canvas>

    <script>
        window.gymCopilotImageCallback = null;
        document.getElementById('gym_copilot_image_input').addEventListener('change', function(e) {
            var file = e.target.files[0];
            if (file) {
                var reader = new FileReader();
                reader.onload = function(evt) {
                    if (window.gymCopilotImageCallback) {
                        window.gymCopilotImageCallback(evt.target.result);
                    }
                };
                reader.readAsDataURL(file);
            }
        });

        window.openGymCopilotFilePicker = function(callback) {
            window.gymCopilotImageCallback = callback;
            var input = document.getElementById('gym_copilot_image_input');
            if (input) {
                input.value = '';
                input.click();
            }
        };
    </script>

    <script src="skiko.js"></script>
    <script src="shared.js?v=20261020_v3"></script>
</body>
</html>
