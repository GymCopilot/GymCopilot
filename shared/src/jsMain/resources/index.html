<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>GymCopilot - Sistema de Gestión de Gimnasios</title>
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="GymCopilot">
    <meta name="mobile-web-app-capable" content="yes">
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #00151C;
            overflow: hidden;
            position: fixed;
            touch-action: none;
        }
        #ComposeTarget {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <input type="file" id="gym_copilot_image_input" accept="image/*" style="display:none">
    <canvas id="ComposeTarget"></canvas>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('./sw.js').catch(function() {});
            });
        }

        function invokeKotlinCb(cb, arg) {
            if (!cb) return;
            try {
                if (typeof cb === 'function') {
                    cb(arg);
                } else if (cb && typeof cb.invoke === 'function') {
                    cb.invoke(arg);
                } else if (cb && typeof cb.invoke_0 === 'function') {
                    cb.invoke_0(arg);
                }
            } catch (e) {
                console.error("Kotlin callback error:", e);
            }
        }

        window.gymCopilotImageCallback = null;
        document.getElementById('gym_copilot_image_input').addEventListener('change', function(e) {
            var file = e.target.files[0];
            if (file) {
                var reader = new FileReader();
                reader.onload = function(evt) {
                    if (window.gymCopilotImageCallback) {
                        invokeKotlinCb(window.gymCopilotImageCallback, evt.target.result);
                    }
                };
                reader.readAsDataURL(file);
            }
        });

        window.openGymCopilotFilePicker = function(callback) {
            window.gymCopilotImageCallback = callback;
            var input = document.getElementById('gym_copilot_image_input');
            if (input) {
                input.value = '';
                input.click();
            }
        };

        window.launchGymCopilotScannerKotlin = function(kotlinCallback) {
            window.openGymCopilotQrScanner(function(code) {
                invokeKotlinCb(kotlinCallback, code);
            });
        };

        window.openGymCopilotQrScanner = function(callback) {
            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                var oldOverlay = document.getElementById('qr_camera_overlay');
                if (oldOverlay && oldOverlay.parentNode) oldOverlay.parentNode.removeChild(oldOverlay);

                var overlay = document.createElement('div');
                overlay.id = 'qr_camera_overlay';
                overlay.style.cssText = 'position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(0,15,22,0.96);z-index:999999;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:sans-serif;color:white;';

                var title = document.createElement('div');
                title.style.cssText = 'font-size:18px;font-weight:bold;color:#00e5ff;margin-bottom:16px;text-align:center;padding:0 16px;';
                title.innerText = 'Escaneando Código QR con Cámara';

                var videoContainer = document.createElement('div');
                videoContainer.style.cssText = 'position:relative;width:280px;height:280px;border-radius:20px;overflow:hidden;border:3px solid #00e5ff;box-shadow:0 0 24px rgba(0,229,255,0.5);background:#000;';

                var video = document.createElement('video');
                video.style.cssText = 'width:100%;height:100%;object-fit:cover;';
                video.setAttribute('playsinline', 'true');
                video.setAttribute('autoplay', 'true');

                videoContainer.appendChild(video);

                var canvasElement = document.createElement('canvas');
                var canvasContext = canvasElement.getContext('2d', { willReadFrequently: true });

                var hint = document.createElement('div');
                hint.style.cssText = 'font-size:13px;color:#aaa;margin-top:16px;text-align:center;padding:0 20px;';
                hint.innerText = 'Apunta la cámara al código QR de asistencia';

                var closeBtn = document.createElement('button');
                closeBtn.style.cssText = 'margin-top:20px;background:#00e5ff;color:#000;border:none;padding:12px 32px;font-size:14px;font-weight:bold;border-radius:20px;cursor:pointer;';
                closeBtn.innerText = 'CANCELAR';

                overlay.appendChild(title);
                overlay.appendChild(videoContainer);
                overlay.appendChild(hint);
                overlay.appendChild(closeBtn);
                document.body.appendChild(overlay);

                var activeStream = null;
                var intervalId = null;

                function stopCamera() {
                    if (intervalId) clearInterval(intervalId);
                    if (activeStream) {
                        activeStream.getTracks().forEach(function(track) { track.stop(); });
                    }
                    if (overlay && overlay.parentNode) {
                        overlay.parentNode.removeChild(overlay);
                    }
                }

                closeBtn.onclick = function() {
                    stopCamera();
                };

                function startScanningStream(stream) {
                    activeStream = stream;
                    video.srcObject = stream;
                    video.play();

                    intervalId = setInterval(function() {
                        if (video.readyState === video.HAVE_ENOUGH_DATA) {
                            canvasElement.width = video.videoWidth;
                            canvasElement.height = video.videoHeight;
                            if (canvasElement.width > 0 && canvasElement.height > 0) {
                                canvasContext.drawImage(video, 0, 0, canvasElement.width, canvasElement.height);
                                var imageData = canvasContext.getImageData(0, 0, canvasElement.width, canvasElement.height);

                                // Try jsQR if loaded
                                if (typeof jsQR === 'function') {
                                    var code = jsQR(imageData.data, imageData.width, imageData.height, { inversionAttempts: "dontInvert" });
                                    if (code && code.data) {
                                        stopCamera();
                                        if (callback) invokeKotlinCb(callback, code.data);
                                        return;
                                    }
                                }

                                // Fallback to BarcodeDetector if available
                                if ('BarcodeDetector' in window) {
                                    var detector = new BarcodeDetector({ formats: ['qr_code'] });
                                    detector.detect(video).then(function(barcodes) {
                                        if (barcodes.length > 0) {
                                            var qrText = barcodes[0].rawValue;
                                            stopCamera();
                                            if (callback) invokeKotlinCb(callback, qrText);
                                        }
                                    }).catch(function() {});
                                }
                            }
                        }
                    }, 250);
                }

                function handleCameraError(msg) {
                    hint.innerText = msg || "Permiso de cámara denegado o no disponible. Habilita el acceso a la cámara en la configuración de tu navegador para escanear.";
                    hint.style.color = "#ff8a80";
                }

                function requestCameraPermission() {
                    var constraintsToTry = [
                        { video: { facingMode: { ideal: "environment" } } },
                        { video: { facingMode: "environment" } },
                        { video: true }
                    ];

                    function tryConstraints(index) {
                        if (index >= constraintsToTry.length) {
                            handleCameraError();
                            return;
                        }
                        navigator.mediaDevices.getUserMedia(constraintsToTry[index])
                            .then(function(stream) {
                                hint.innerText = 'Apunta la cámara al código QR de asistencia';
                                hint.style.color = '#aaa';
                                startScanningStream(stream);
                            })
                            .catch(function(err) {
                                if (err && (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError')) {
                                    handleCameraError("Permiso de cámara denegado. Habilita la cámara en la configuración de tu navegador para escanear.");
                                } else {
                                    tryConstraints(index + 1);
                                }
                            });
                    }

                    tryConstraints(0);
                }

                if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                    requestCameraPermission();
                } else {
                    handleCameraError("Tu navegador no soporta el acceso a la cámara.");
                }
            }
        };

        let deferredPrompt = null;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
        });

        window.addEventListener('appinstalled', (evt) => {
            deferredPrompt = null;
            window.location.reload();
        });

        window.isGymCopilotStandalone = function() {
            return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
        };

        window.isIOSDevice = function() {
            return /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        };

        window.triggerGymCopilotInstall = function() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then((choiceResult) => {
                    if (choiceResult.outcome === 'accepted') {
                        console.log('User accepted the install prompt');
                    }
                    deferredPrompt = null;
                });
                return true;
            } else {
                return false;
            }
        };

        window.printGymCopilotRoutines = function(routinesJson, customTitle, customObjective, customSubObjective) {
            try {
                var routines = JSON.parse(routinesJson);
                if (!routines || !Array.isArray(routines) || routines.length === 0) return;

                var win = window.open('', '_blank');
                if (!win) return;

                var html = '<!DOCTYPE html><html><head><meta charset="utf-8">';
                html += '<title>' + (customTitle || 'Rutina de Entrenamiento - GymCopilot') + '</title>';
                html += '<style>';
                html += '@page { size: A4 portrait; margin: 15mm; }';
                html += 'body { font-family: system-ui, -apple-system, sans-serif; color: #1E293B; background: #fff; margin: 0; padding: 20px; }';
                html += '.header { border-bottom: 2px solid #00222E; padding-bottom: 12px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }';
                html += '.header h1 { margin: 0; font-size: 24px; color: #00222E; font-weight: 800; text-transform: uppercase; }';
                html += '.header h2 { margin: 4px 0 0 0; font-size: 14px; color: #00897B; font-weight: 600; }';
                html += '.header h3 { margin: 2px 0 0 0; font-size: 12px; color: #64748B; font-weight: 500; }';
                html += '.routine-box { border: 1.5px solid #CBD5E1; border-radius: 12px; margin-bottom: 24px; padding: 16px; page-break-inside: avoid; }';
                html += '.routine-title { font-size: 18px; font-weight: bold; color: #0f172a; margin-bottom: 12px; border-bottom: 1px solid #e2e8f0; padding-bottom: 6px; }';
                html += 'table { width: 100%; border-collapse: collapse; margin-top: 8px; }';
                html += 'th, td { border: 1px solid #CBD5E1; padding: 8px 10px; text-align: left; font-size: 13px; }';
                html += 'th { background-color: #F1F5F9; color: #334155; font-weight: 700; text-transform: uppercase; font-size: 11px; }';
                html += '.footer { text-align: center; margin-top: 30px; font-size: 11px; color: #94A3B8; border-top: 1px solid #E2E8F0; padding-top: 10px; }';
                html += '</style></head><body>';

                html += '<div class="header">';
                html += '<div>';
                html += '<h1>' + (customTitle || 'Rutina de Entrenamiento') + '</h1>';
                if (customObjective) html += '<h2>Objetivo: ' + customObjective + '</h2>';
                if (customSubObjective) html += '<h3>Programa: ' + customSubObjective + '</h3>';
                html += '</div>';
                html += '<div style="text-align:right; font-size:12px; color:#64748B;">GymCopilot PWA</div>';
                html += '</div>';

                routines.forEach(function(r) {
                    html += '<div class="routine-box">';
                    html += '<div class="routine-title">' + (r.name || 'Rutina') + (r.category ? ' (' + r.category + ')' : '') + '</div>';
                    if (r.exercises && r.exercises.length > 0) {
                        html += '<table>';
                        html += '<thead><tr><th>Ejercicio</th><th>Series</th><th>Reps</th><th>Descanso</th><th>Notas</th></tr></thead>';
                        html += '<tbody>';
                        r.exercises.forEach(function(ex) {
                            html += '<tr>';
                            html += '<td style="font-weight:600;">' + (ex.name || '') + '</td>';
                            html += '<td>' + (ex.sets || '-') + '</td>';
                            html += '<td>' + (ex.reps || '-') + '</td>';
                            html += '<td>' + (ex.rest || '-') + '</td>';
                            html += '<td>' + (ex.notes || ex.muscleGroup || '') + '</td>';
                            html += '</tr>';
                        });
                        html += '</tbody></table>';
                    } else {
                        html += '<p style="font-size:12px; color:#64748B;">Sin ejercicios asignados</p>';
                    }
                    html += '</div>';
                });

                html += '<div class="footer">Generado desde GymCopilot Web | Todos los derechos reservados</div>';
                html += '</body></html>';

                win.document.write(html);
                win.document.close();
                setTimeout(function() {
                    win.print();
                }, 500);
            } catch(e) {
                console.error("Error generating print routines:", e);
            }
        };

    </script>

    <script src="skiko.js"></script>
    <script src="shared.js?v=20261021_v4"></script>
</body>
</html>
