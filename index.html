<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>GymCopilot - Sistema de Gestión de Gimnasios</title>
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="GymCopilot">
    <meta name="mobile-web-app-capable" content="yes">
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #00151C;
            overflow: hidden;
            position: fixed;
            touch-action: none;
        }
        #ComposeTarget {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <input type="file" id="gym_copilot_image_input" accept="image/*" style="display:none">
    <canvas id="ComposeTarget"></canvas>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('./sw.js').catch(function() {});
            });
        }

        function invokeKotlinCb(cb, arg) {
            if (!cb) return;
            try {
                if (typeof cb === 'function') {
                    cb(arg);
                } else if (cb && typeof cb.invoke === 'function') {
                    cb.invoke(arg);
                }
            } catch (e) {
                console.error("Kotlin callback error:", e);
            }
        }

        window.gymCopilotImageCallback = null;
        document.getElementById('gym_copilot_image_input').addEventListener('change', function(e) {
            var file = e.target.files[0];
            if (file) {
                var reader = new FileReader();
                reader.onload = function(evt) {
                    if (window.gymCopilotImageCallback) {
                        invokeKotlinCb(window.gymCopilotImageCallback, evt.target.result);
                    }
                };
                reader.readAsDataURL(file);
            }
        });

        window.openGymCopilotFilePicker = function(callback) {
            window.gymCopilotImageCallback = callback;
            var input = document.getElementById('gym_copilot_image_input');
            if (input) {
                input.value = '';
                input.click();
            }
        };

        window.launchGymCopilotScannerKotlin = function(kotlinCallback) {
            window.openGymCopilotQrScanner(function(code) {
                invokeKotlinCb(kotlinCallback, code);
            });
        };

        window.openGymCopilotQrScanner = function(callback) {
            var oldOverlay = document.getElementById('qr_camera_overlay');
            if (oldOverlay && oldOverlay.parentNode) oldOverlay.parentNode.removeChild(oldOverlay);

            var overlay = document.createElement('div');
            overlay.id = 'qr_camera_overlay';
            overlay.style.cssText = 'position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(0,15,22,0.96);z-index:999999;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:sans-serif;color:white;box-sizing:border-box;padding:16px;';

            var title = document.createElement('div');
            title.style.cssText = 'font-size:18px;font-weight:bold;color:#00e5ff;margin-bottom:16px;text-align:center;padding:0 16px;';
            title.innerText = 'Escaneando Código QR con Cámara';

            var videoContainer = document.createElement('div');
            videoContainer.style.cssText = 'position:relative;width:280px;height:280px;border-radius:20px;overflow:hidden;border:3px solid #00e5ff;box-shadow:0 0 24px rgba(0,229,255,0.5);background:#000;display:flex;align-items:center;justify-content:center;';

            var video = document.createElement('video');
            video.style.cssText = 'width:100%;height:100%;object-fit:cover;';
            video.setAttribute('playsinline', 'true');
            video.setAttribute('autoplay', 'true');

            videoContainer.appendChild(video);

            var canvasElement = document.createElement('canvas');
            var canvasContext = canvasElement.getContext('2d', { willReadFrequently: true });

            var hint = document.createElement('div');
            hint.style.cssText = 'font-size:13px;color:#aaa;margin-top:16px;text-align:center;padding:0 20px;max-width:320px;line-height:1.4;';
            hint.innerText = 'Apunta la cámara al código QR de asistencia';

            var manualContainer = document.createElement('div');
            manualContainer.style.cssText = 'margin-top:16px;display:none;flex-direction:column;align-items:center;width:100%;max-width:320px;';

            var manualInput = document.createElement('input');
            manualInput.type = 'text';
            manualInput.placeholder = 'Ingresa código QR, Token o Email...';
            manualInput.style.cssText = 'width:100%;padding:12px;border-radius:12px;border:1px solid #00e5ff;background:#001a24;color:white;font-size:14px;outline:none;box-sizing:border-box;text-align:center;';

            var submitManualBtn = document.createElement('button');
            submitManualBtn.style.cssText = 'margin-top:10px;width:100%;background:#00e5ff;color:#000;border:none;padding:12px;font-size:14px;font-weight:bold;border-radius:12px;cursor:pointer;';
            submitManualBtn.innerText = 'ACEPTAR';

            manualContainer.appendChild(manualInput);
            manualContainer.appendChild(submitManualBtn);

            var actionRow = document.createElement('div');
            actionRow.style.cssText = 'margin-top:16px;display:flex;gap:10px;flex-wrap:wrap;justify-content:center;';

            var fileBtn = document.createElement('button');
            fileBtn.style.cssText = 'background:transparent;color:#00e5ff;border:1px solid #00e5ff;padding:10px 18px;font-size:13px;font-weight:bold;border-radius:20px;cursor:pointer;';
            fileBtn.innerText = '📷 SUBIR FOTO DE QR';

            var manualBtn = document.createElement('button');
            manualBtn.style.cssText = 'background:transparent;color:#00e5ff;border:1px solid #00e5ff;padding:10px 18px;font-size:13px;font-weight:bold;border-radius:20px;cursor:pointer;';
            manualBtn.innerText = 'INGRESAR MANUAL';

            var retryBtn = document.createElement('button');
            retryBtn.style.cssText = 'background:transparent;color:#ffb74d;border:1px solid #ffb74d;padding:10px 18px;font-size:13px;font-weight:bold;border-radius:20px;cursor:pointer;display:none;';
            retryBtn.innerText = 'REINTENTAR CÁMARA';

            var closeBtn = document.createElement('button');
            closeBtn.style.cssText = 'background:#00e5ff;color:#000;border:none;padding:10px 22px;font-size:13px;font-weight:bold;border-radius:20px;cursor:pointer;';
            closeBtn.innerText = 'CANCELAR';

            actionRow.appendChild(fileBtn);
            actionRow.appendChild(manualBtn);
            actionRow.appendChild(retryBtn);
            actionRow.appendChild(closeBtn);

            overlay.appendChild(title);
            overlay.appendChild(videoContainer);
            overlay.appendChild(hint);
            overlay.appendChild(manualContainer);
            overlay.appendChild(actionRow);
            document.body.appendChild(overlay);

            var activeStream = null;
            var intervalId = null;

            // Hidden file input for scanning QR from photo gallery or system camera
            var qrFileInput = document.getElementById('gym_copilot_qr_file_input');
            if (!qrFileInput) {
                qrFileInput = document.createElement('input');
                qrFileInput.type = 'file';
                qrFileInput.id = 'gym_copilot_qr_file_input';
                qrFileInput.accept = 'image/*';
                qrFileInput.style.display = 'none';
                document.body.appendChild(qrFileInput);
            }

            fileBtn.onclick = function() {
                qrFileInput.value = '';
                qrFileInput.click();
            };

            qrFileInput.onchange = function(e) {
                var file = e.target.files[0];
                if (!file) return;
                var reader = new FileReader();
                reader.onload = function(evt) {
                    var img = new Image();
                    img.onload = function() {
                        var tempCanvas = document.createElement('canvas');
                        tempCanvas.width = img.width;
                        tempCanvas.height = img.height;
                        var ctx = tempCanvas.getContext('2d');
                        ctx.drawImage(img, 0, 0);
                        var imgData = ctx.getImageData(0, 0, img.width, img.height);

                        var scannedCode = null;
                        if (typeof jsQR === 'function') {
                            var code = jsQR(imgData.data, imgData.width, imgData.height, { inversionAttempts: "dontInvert" });
                            if (code && code.data) scannedCode = code.data;
                        }

                        if (scannedCode) {
                            stopCamera();
                            if (callback) callback(scannedCode);
                        } else {
                            hint.innerText = "⚠️ No se detectó ningún código QR en la imagen. Intenta con otra foto o ingresa el código manualmente.";
                            hint.style.color = "#ff8a80";
                        }
                    };
                    img.src = evt.target.result;
                };
                reader.readAsDataURL(file);
            };

            function stopCamera() {
                if (intervalId) clearInterval(intervalId);
                if (activeStream) {
                    activeStream.getTracks().forEach(function(track) { track.stop(); });
                    activeStream = null;
                }
                if (overlay && overlay.parentNode) {
                    overlay.parentNode.removeChild(overlay);
                }
            }

            closeBtn.onclick = function() {
                stopCamera();
            };

            function submitManual() {
                var code = manualInput.value.trim();
                if (code) {
                    stopCamera();
                    if (callback) callback(code);
                }
            }

            submitManualBtn.onclick = submitManual;
            manualInput.onkeypress = function(e) {
                if (e.key === 'Enter') submitManual();
            };

            manualBtn.onclick = function() {
                manualContainer.style.display = 'flex';
                manualInput.focus();
            };

            retryBtn.onclick = function() {
                retryBtn.style.display = 'none';
                hint.innerText = 'Apunta la cámara al código QR de asistencia';
                hint.style.color = '#aaa';
                tryCamera(constraintsToTry, 0);
            };

            function startStream(stream) {
                activeStream = stream;
                video.srcObject = stream;
                video.play().catch(function() {});

                intervalId = setInterval(function() {
                    if (video.readyState === video.HAVE_ENOUGH_DATA) {
                        canvasElement.width = video.videoWidth;
                        canvasElement.height = video.videoHeight;
                        if (canvasElement.width > 0 && canvasElement.height > 0) {
                            canvasContext.drawImage(video, 0, 0, canvasElement.width, canvasElement.height);
                            var imageData = canvasContext.getImageData(0, 0, canvasElement.width, canvasElement.height);

                            if (typeof jsQR === 'function') {
                                var code = jsQR(imageData.data, imageData.width, imageData.height, { inversionAttempts: "dontInvert" });
                                if (code && code.data) {
                                    stopCamera();
                                    if (callback) callback(code.data);
                                    return;
                                }
                            }

                            if ('BarcodeDetector' in window) {
                                var detector = new BarcodeDetector({ formats: ['qr_code'] });
                                detector.detect(video).then(function(barcodes) {
                                    if (barcodes.length > 0) {
                                        var qrText = barcodes[0].rawValue;
                                        stopCamera();
                                        if (callback) callback(qrText);
                                    }
                                }).catch(function() {});
                            }
                        }
                    }
                }, 250);
            }

            function tryCamera(constraintsList, index) {
                if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                    onCameraError("El navegador no soporta acceso a la cámara.");
                    return;
                }
                if (index >= constraintsList.length) {
                    onCameraError("No se pudo acceder a la cámara. Revisa los permisos de tu navegador.");
                    return;
                }
                navigator.mediaDevices.getUserMedia(constraintsList[index])
                    .then(function(stream) {
                        startStream(stream);
                    })
                    .catch(function(err) {
                        if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
                            onCameraError("Permiso de cámara denegado. Haz clic en el icono 🔒 en la barra de tu navegador para dar permiso, o sube una foto de tu QR abajo.");
                        } else {
                            tryCamera(constraintsList, index + 1);
                        }
                    });
            }

            function onCameraError(msg) {
                hint.innerText = '⚠️ ' + msg;
                hint.style.color = '#ff8a80';
                manualContainer.style.display = 'flex';
                retryBtn.style.display = 'inline-block';
                manualInput.focus();
            }

            var constraintsToTry = [
                { video: { facingMode: { ideal: "environment" } } },
                { video: { facingMode: "environment" } },
                { video: true }
            ];

            tryCamera(constraintsToTry, 0);
        };
        };

        let deferredPrompt = null;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
        });

        window.addEventListener('appinstalled', (evt) => {
            deferredPrompt = null;
            window.location.reload();
        });

        window.isGymCopilotStandalone = function() {
            return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
        };

        window.isIOSDevice = function() {
            return /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        };

        window.triggerGymCopilotInstall = function() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then((choiceResult) => {
                    if (choiceResult.outcome === 'accepted') {
                        console.log('User accepted the install prompt');
                    }
                    deferredPrompt = null;
                });
                return true;
            } else {
                return false;
            }
        };
    </script>

    <script src="skiko.js"></script>
    <script src="shared.js?v=20261021_v4"></script>
</body>
</html>
